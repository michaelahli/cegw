syntax = "proto3";

package cegw.v1;

option go_package = "github.com/michaelahli/cegw/gen/cegw/v1;cegwv1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "cegw/v1/common.proto";

service TradingService {
  rpc CreateMarketOrder(CreateMarketOrderRequest) returns (CreateMarketOrderResponse) {
    option (google.api.http) = {
      post: "/v1/trading/order"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Market Order"
      description: "Place a market buy or sell order on the specified exchange."
      tags: "Trading"
    };
  }

  rpc CreateLimitOrder(CreateLimitOrderRequest) returns (CreateLimitOrderResponse) {
    option (google.api.http) = {
      post: "/v1/trading/order/limit"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Create Limit Order"
      description: "Place a limit buy or sell order at a specific price."
      tags: "Trading"
    };
  }

  rpc TestCredentials(TestCredentialsRequest) returns (TestCredentialsResponse) {
    option (google.api.http) = {
      post: "/v1/trading/credentials/test"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Test Credentials"
      description: "Validate API credentials for an exchange."
      tags: "Trading"
    };
  }

  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse) {
    option (google.api.http) = {
      post: "/v1/trading/balance"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Balance"
      description: "Fetch account balance for an exchange."
      tags: "Trading"
    };
  }

  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse) {
    option (google.api.http) = {
      get: "/v1/trading/order/{exchange}/{order_id}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Get Order"
      description: "Fetch a specific order by ID from an exchange."
      tags: "Trading"
    };
  }

  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse) {
    option (google.api.http) = {
      post: "/v1/trading/order/cancel"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Cancel Order"
      description: "Cancel an open order on the specified exchange."
      tags: "Trading"
    };
  }

  rpc ListOpenOrders(ListOpenOrdersRequest) returns (ListOpenOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/trading/orders/open/{exchange}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Open Orders"
      description: "Fetch all open orders for a symbol or all symbols from an exchange."
      tags: "Trading"
    };
  }

  rpc ListClosedOrders(ListClosedOrdersRequest) returns (ListClosedOrdersResponse) {
    option (google.api.http) = {
      get: "/v1/trading/orders/closed/{exchange}"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "List Closed Orders"
      description: "Fetch closed orders for a symbol or all symbols from an exchange."
      tags: "Trading"
    };
  }

  rpc CancelAllOrders(CancelAllOrdersRequest) returns (CancelAllOrdersResponse) {
    option (google.api.http) = {
      post: "/v1/trading/orders/cancel"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "Cancel All Orders"
      description: "Cancel all open orders, optionally filtered by symbol."
      tags: "Trading"
    };
  }
}

message CreateMarketOrderRequest {
  Exchange exchange = 1;
  string symbol = 2;
  OrderSide side = 3;
  double quantity = 4;
  Credentials credentials = 5;
}

message Order {
  string order_id = 1;
  string symbol = 2;
  OrderSide side = 3;
  double quantity = 4;
  double price = 5;
  OrderStatus status = 6;
  google.protobuf.Timestamp timestamp = 7;
}

message CreateMarketOrderResponse {
  Order order = 1;
}

message TestCredentialsRequest {
  Exchange exchange = 1;
  Credentials credentials = 2;
}

message TestCredentialsResponse {
  bool valid = 1;
  string message = 2;
}

message GetBalanceRequest {
  Exchange exchange = 1;
  Credentials credentials = 2;
}

message Balance {
  string asset = 1;
  double free = 2;
  double used = 3;
  double total = 4;
}

message GetBalanceResponse {
  repeated Balance balances = 1;
}

message GetOrderRequest {
  Exchange exchange = 1;
  string order_id = 2;
  string symbol = 3;
  Credentials credentials = 4;
}

message GetOrderResponse {
  Order order = 1;
}

message CancelOrderRequest {
  Exchange exchange = 1;
  string order_id = 2;
  string symbol = 3;
  Credentials credentials = 4;
}

message CancelOrderResponse {
  bool success = 1;
  string message = 2;
}

message CreateLimitOrderRequest {
  Exchange exchange = 1;
  string symbol = 2;
  OrderSide side = 3;
  double quantity = 4;
  double price = 5;
  TimeInForce time_in_force = 6;
  Credentials credentials = 7;
}

message CreateLimitOrderResponse {
  Order order = 1;
}

message ListOpenOrdersRequest {
  Exchange exchange = 1;
  string symbol = 2;
  Credentials credentials = 3;
}

message ListOpenOrdersResponse {
  repeated Order orders = 1;
}

message ListClosedOrdersRequest {
  Exchange exchange = 1;
  string symbol = 2;
  Credentials credentials = 3;
}

message ListClosedOrdersResponse {
  repeated Order orders = 1;
}

message CancelAllOrdersRequest {
  Exchange exchange = 1;
  string symbol = 2;
  Credentials credentials = 3;
}

message CancelAllOrdersResponse {
  bool success = 1;
  string message = 2;
  int32 cancelled_count = 3;
}
